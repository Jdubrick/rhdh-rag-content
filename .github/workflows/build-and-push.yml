name: Build and Push RAG Container

on:
  workflow_dispatch:
    inputs:
      artifact_release_tag:
        description: "Release tag containing RAG assets (defaults to triggering release tag for release events)."
        required: false
      image_tag:
        description: "Optional image tag override."
        required: false
  release:
    types: [published]

env:
  IMAGE_NAME: rag-content
  IMAGE_REGISTRY: quay.io
  REGISTRY_ORG: redhat-ai-dev
  CONTAINER_FILE: Containerfile

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      asset_url: ${{ steps.resolve.outputs.asset_url }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
      - name: Resolve asset release and image tags
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${{ inputs.artifact_release_tag }}"
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "artifact_release_tag is required for manual workflow_dispatch runs" >&2
            exit 1
          fi

          # Expected release tag format:
          # rag-assets-rhdh-<docs_version>-lls-<llama_tag_suffix>
          if [[ "$RELEASE_TAG" =~ ^rag-assets-rhdh-(.+)-lls-(.+)$ ]]; then
            RHDH_VERSION="${BASH_REMATCH[1]}"
            TAG_SUFFIX="${BASH_REMATCH[2]}"
          else
            echo "Unsupported release tag format: $RELEASE_TAG" >&2
            echo "Expected: rag-assets-rhdh-<docs_version>-lls-<llama_suffix>" >&2
            exit 1
          fi

          if [ -n "${{ inputs.image_tag }}" ]; then
            LATEST_TAG="${{ inputs.image_tag }}"
          else
            LATEST_TAG="release-${RHDH_VERSION}-lls-${TAG_SUFFIX}"
          fi
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${RELEASE_TAG}.tar.gz"

          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "asset_url=${ASSET_URL}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

          echo "Resolved release tag: ${RELEASE_TAG}"
          echo "Resolved asset URL: ${ASSET_URL}"
          echo "Image tag: ${LATEST_TAG}"

  build:
    needs: setup
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Set tag from setup
        run: |
          echo "LATEST_TAG=${{ needs.setup.outputs.latest_tag }}" >> $GITHUB_ENV
          echo "RAG_ASSET_URL=${{ needs.setup.outputs.asset_url }}" >> $GITHUB_ENV
      - name: Install buildah
        run: |
          sudo apt update
          sudo apt install -y buildah
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image with Buildah
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          layers: true
          image: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ env.LATEST_TAG }}-${{ matrix.arch }}-${{ github.sha }}
          containerfiles: |
            ${{ env.CONTAINER_FILE }}
          archs: ${{ matrix.arch }}
          oci: true
          build-args: |
            RAG_ASSETS_URL=${{ env.RAG_ASSET_URL }}
      - name: Check images
        run: |
          buildah images | grep '${{ env.IMAGE_NAME }}'
          echo '${{ steps.build_image.outputs.image }}'
          echo '${{ steps.build_image.outputs.tags }}'
      - name: Push architecture-specific image to Quay.io
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}
          username: ${{ secrets.QUAY_REGISTRY_USERNAME }}
          password: ${{ secrets.QUAY_REGISTRY_PASSWORD }}

  create-manifest:
    needs: [build, setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set tag from setup
        run: |
          echo "LATEST_TAG=${{ needs.setup.outputs.latest_tag }}" >> $GITHUB_ENV
      - name: Install buildah
        run: |
          sudo apt update
          sudo apt install -y buildah
      - name: Login to registry
        run: |
          echo "${{ secrets.QUAY_REGISTRY_PASSWORD }}" | buildah login --username "${{ secrets.QUAY_REGISTRY_USERNAME }}" --password-stdin ${{ env.IMAGE_REGISTRY }}
      - name: Create and push manifest
        run: |
          # Create manifests
          buildah manifest create ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          buildah manifest add ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }} ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-amd64-${{ github.sha }}
          buildah manifest add ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }} ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-arm64-${{ github.sha }}
          
          buildah manifest create ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ github.sha }}
          buildah manifest add ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ github.sha }} ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-amd64-${{ github.sha }}
          buildah manifest add ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ github.sha }} ${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-arm64-${{ github.sha }}
          
          # Push manifests
          buildah manifest push --all ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }} docker://${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}
          buildah manifest push --all ${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ github.sha }} docker://${{ env.IMAGE_REGISTRY }}/${{ env.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}:${{ env.LATEST_TAG }}-${{ github.sha }}
